# Night light (blue light filter) profiles for hyprsunset.
# Lower temperature = warmer screen. Each profile activates at its `time`
# and resets whatever the previous one set. `identity` disables the filter.
# Mainly control live via: hyprctl hyprsunset temperature <K>
max-gamma = 100

profile {
    time = 7:00
    identity = true
}

profile {
    time = 19:00
    temperature = 5000
}