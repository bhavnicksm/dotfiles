# Starship prompt — Flexoki light palette
# Matches the Ghostty "flexoki-light" theme and gruvbox-ish accents
# (blue #205EA6, gray #87857F, red #AF3029).

scan_timeout = 10
add_newline = true
command_timeout = 500

# First line: context, then nothing heavy. Second line: prompt arrow.
format = """
$directory$git_branch$git_status$git_commit\
$cmd_duration$python$nodejs$package\
$line_break$username$character"""

[character]
success_symbol = "[❯](bold #205EA6)"
error_symbol = "[❯](bold #AF3029)"
vicmd_symbol = "[❯](bold #5E409D)"

[directory]
truncation_length = 3
truncation_symbol = "…/"
style = "bold #100F0F"
read_only = " 🔒"

[directory.substitutions]
"^~/Projects/dotfiles$" = "dotfiles"
"^~/Projects$" = "projects"

[git_branch]
symbol = " "
format = "on [$symbol$branch]($style)"
style = "bold #AD8301"
truncation_length = 4

[git_status]
style = "bold #AF3029"
format = "([$all_status$ahead_behind]($style))"

[git_commit]
format = "[$hash$tag]($style)"
style = "#87857F"

[cmd_duration]
min_time = 2_000
style = "#87857F"
format = " took [$duration]($style)"

[python]
symbol = " "
format = "[$symbol$python_version]($style) "
style = "#24837B"

[nodejs]
symbol = " "
format = "[$symbol$version]($style) "
style = "#66800B"

[package]
symbol = " "
format = "[$symbol$version]($style) "
style = "#5E409D"

[username]
show_always = false
format = "[$user]($style) "
style = "bold #BC5215"

[status]
disabled = true